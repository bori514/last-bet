<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>13 · THE LAST BET</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#f5e6c7;background:#100d0b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 20%,#4b3022,#110d0b 75%)}button,input{font:inherit}button{border:1px solid #b88d50;background:#3d2920;color:#ffe8b6;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700}button:disabled{opacity:.3;cursor:default}button.primary{background:#a16b2c;color:#130c07}input{background:#211914;border:1px solid #80603c;border-radius:10px;color:white;padding:13px;max-width:100%}.hidden{display:none!important}.panel{background:#19120edb;border:1px solid #80603c;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0008}h1{font-size:clamp(25px,4vw,42px);letter-spacing:3px;margin:8px 0}h2{margin:0 0 15px;font-size:20px}.muted{color:#c5ad88;font-size:13px}.lobby{max-width:500px;margin:8vh auto;padding:20px}.lobby .panel{display:grid;gap:12px}.app{max-width:1300px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-top:10px}.table-wrap{position:relative;min-height:620px;border-radius:26px;background:radial-gradient(ellipse at 50% 45%,#62432d 0%,#2c1b14 65%,#1b100d 100%);overflow:hidden;border:1px solid #795633}.table{position:absolute;left:8%;top:15%;width:84%;height:69%;border:22px solid #5e331d;border-radius:50%;background:radial-gradient(ellipse,#20583f,#123d2e 75%);box-shadow:inset 0 0 0 5px #9c7540,inset 0 0 45px #0009,0 10px 30px #000a}.pot{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;background:#0d211bcf;border:1px solid #a98b4d;padding:14px 25px;border-radius:20px;white-space:nowrap}.pot strong{display:block;font-size:clamp(19px,3vw,30px)}.seat{position:absolute;transform:translate(-50%,-50%);min-width:135px;max-width:180px;text-align:center;background:#120e0de8;border:1px solid #826038;border-radius:14px;padding:9px;box-shadow:0 4px 15px #000a;font-size:13px}.seat.me{border:2px solid #e5b765}.seat.turn{box-shadow:0 0 18px #f5bc57}.seat.folded{opacity:.55}.seat .name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.seat .money{color:#edc88b;margin-top:3px}.card{display:inline-grid;place-items:center;width:38px;height:52px;margin:6px 3px 0;border-radius:6px;background:#f5e9d1;color:#3a241b;font-weight:900;font-size:21px;border:2px solid #ad9063}.card.back{background:repeating-linear-gradient(45deg,#573d40,#573d40 6px,#8b5960 6px,#8b5960 10px);color:#fff}.card.unknown{background:#332b24;color:#ad987b}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px 0}.actions input{width:120px}.sidebar{display:grid;align-content:start;gap:12px}.log{height:225px;overflow:auto;font-size:12px;line-height:1.7}.tag{display:inline-block;border:1px solid #97764a;border-radius:6px;padding:4px 8px;margin:3px;font-size:12px}.result{padding:12px;text-align:center;background:#19120edb;border:1px solid #9b773c;border-radius:14px;margin:10px 0}.error{color:#ff9c87;min-height:20px}.roomcode{font-size:24px;letter-spacing:4px;font-weight:900;color:#ffd58b}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.table-wrap{min-height:530px}.seat{min-width:105px;font-size:11px;padding:6px}.card{width:30px;height:42px;font-size:17px}.table{border-width:14px}}@media(max-width:540px){.sidebar{grid-template-columns:1fr}.table-wrap{min-height:480px}.seat{min-width:88px;max-width:105px}.pot{padding:9px}.table{left:4%;width:92%}}
</style></head><body><div id="lobby" class="lobby"><h1>♠ 13 · THE LAST BET</h1><p class="muted">13라운드의 심리전 · 3~6인 온라인 카드 배팅</p><div class="panel"><label>플레이어 이름</label><input id="name" maxlength="16" placeholder="닉네임" value="플레이어"><button class="primary" onclick="createRoom()">새 방 만들기</button><div class="muted" style="text-align:center">또는 친구의 방 코드로 입장</div><input id="joinCode" maxlength="6" placeholder="6자리 방 코드" style="text-transform:uppercase"><button onclick="joinRoom()">방 입장</button><div id="lobbyError" class="error"></div></div></div><main id="app" class="app hidden"><header class="top"><div><h1>♠ THE LAST BET</h1><span id="status" class="muted"></span></div><div class="panel" style="text-align:center">방 코드<div id="roomCode" class="roomcode"></div><button onclick="copyCode()" style="padding:6px 10px">코드 복사</button></div></header><div id="result" class="result hidden"></div><div class="layout"><section><div class="table-wrap"><div class="table"></div><div class="pot">현재 팟<strong id="pot">0원</strong><span id="currentBet" class="muted"></span></div><div id="seats"></div></div><div class="actions" id="actions"></div><div class="error" id="actionError"></div></section><aside class="sidebar"><div class="panel"><h2>게임 진행</h2><div id="summary"></div></div><div class="panel"><h2>내 카드 사용 현황</h2><div class="muted">공개 카드</div><div id="usedPublic"></div><div class="muted" style="margin-top:10px">비공개 카드</div><div id="usedPrivate"></div></div><div class="panel"><h2>게임 로그</h2><div class="log" id="log"></div></div></aside></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let state=null;const $=id=>document.getElementById(id),fmt=n=>(n||0).toLocaleString('ko-KR')+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function createRoom(){socket.emit('create',{name:$('name').value},response)}function joinRoom(){socket.emit('join',{name:$('name').value,code:$('joinCode').value},response)}function response(r){if(r.error)$('lobbyError').textContent=r.error;else{$('lobby').classList.add('hidden');$('app').classList.remove('hidden');}}function copyCode(){navigator.clipboard?.writeText(state.code)}function send(type){socket.emit('action',{type,amount:Number($('raiseAmount')?.value||50000)},r=>{$('actionError').textContent=r?.error||''})}function button(label,fn,disabled=false,primary=false){return `<button ${primary?'class="primary"':''} ${disabled?'disabled':''} onclick="${fn}">${label}</button>`}
function card(n,kind){return `<span class="card ${kind||''}">${n==null?'?':n}</span>`}function render(){const s=state;if(!s)return;const me=s.players.find(p=>p.id===s.me);$('roomCode').textContent=s.code;$('status').textContent=`${s.phase==='lobby'?'대기실':s.phase==='finished'?'게임 종료':`라운드 ${s.round}/13`} · ${s.players.length}명`;$('pot').textContent=fmt(s.pot);$('currentBet').textContent=`현재 배팅 ${fmt(s.currentBet)}`;const seats=$('seats');seats.innerHTML='';const positions=s.players.length===3?[[50,86],[17,30],[83,30]]:s.players.length===4?[[50,86],[13,50],[50,12],[87,50]]:s.players.length===5?[[50,86],[13,65],[23,18],[77,18],[87,65]]:[[50,86],[13,70],[13,26],[50,10],[87,26],[87,70]];const ordered=[me,...s.players.filter(p=>p.id!==s.me)];ordered.forEach((p,i)=>{const [x,y]=positions[i];const div=document.createElement('div');div.className=`seat ${p.id===s.me?'me':''} ${p.id===s.turn?'turn':''} ${p.fold?'folded':''}`;div.style.left=x+'%';div.style.top=y+'%';const show=s.showdown?.find(v=>v.id===p.id);div.innerHTML=`<div class="name">${esc(p.name)} ${p.id===s.me?'(나)':''}</div><div class="money">${fmt(p.money)}</div>${s.phase!=='lobby'?`<div>${p.id===s.me?card(null,'unknown'):card(p.publicCard,p.publicCard==null?'unknown':'')}${p.id===s.me?card(p.privateCard,p.privateCard==null?'unknown':''):card(show?.privateCard??null,'back')}</div><div class="muted">${p.fold?'폴드 / 관전':p.allin?'올인':p.id===s.turn?'배팅 차례':`이번 배팅 ${fmt(p.roundBet)}`}</div>`:''}`;seats.appendChild(div)});
const actions=$('actions');actions.innerHTML='';if(s.phase==='lobby'){actions.innerHTML=`<span>친구에게 방 코드 ${esc(s.code)}를 공유하세요.</span>${button('게임 시작',"socket.emit('start')",s.host!==s.me||!s.canStart,true)}`;}else if(s.phase==='bet'&&s.turn===s.me){const owed=Math.max(0,s.currentBet-me.roundBet);actions.innerHTML=button('폴드',"send('fold')")+button(owed?'콜 '+fmt(Math.min(owed,me.money)):'체크',`send('${owed?'call':'check'}')`)+`<input id="raiseAmount" type="number" min="50000" step="50000" value="50000" aria-label="레이즈 금액">`+button('레이즈',"send('raise')",me.money<owed+50000,true)}else if(s.phase==='bet')actions.innerHTML='<span class="muted">다른 플레이어의 행동을 기다리는 중…</span>';else if(s.phase==='result')actions.innerHTML=button('다음 라운드',"socket.emit('next')",s.host!==s.me,true);else actions.innerHTML='<span>게임이 종료되었습니다.</span>';
$('summary').innerHTML=`<div>시작 자본: ${fmt(2000000)}</div><div>내 자본: <strong>${fmt(me.money)}</strong></div><div>기본 참가비: ${fmt(50000)}</div><div>배팅 단위: ${fmt(50000)}</div><div>진행: ${esc(s.phase)}</div>`;for(const [id,arr] of [['usedPublic',me.usedPublic],['usedPrivate',me.usedPrivate]])$(id).innerHTML=Array.from({length:13},(_,i)=>`<span class="tag" style="opacity:${arr?.includes(i+1)?.35:1}">${i+1}</span>`).join('');$('log').innerHTML=s.log.map(x=>`<div>• ${esc(x)}</div>`).join('');const res=$('result');res.classList.toggle('hidden',!['result','finished'].includes(s.phase));if(s.phase==='result')res.innerHTML=`<strong>라운드 ${s.round} 종료</strong><div>승자: ${s.players.filter(p=>s.winners.includes(p.id)).map(p=>esc(p.name)).join(', ')}</div><div class="muted">${s.showdown.map(v=>esc(s.players.find(p=>p.id===v.id)?.name)+': '+v.publicCard+' + '+v.privateCard+' = '+v.sum).join(' · ')}</div>`;if(s.phase==='finished')res.innerHTML=`<h2>🏆 최종 순위</h2>${[...s.players].sort((a,b)=>b.money-a.money).map((p,i)=>`<div>${i+1}위 ${esc(p.name)} · ${fmt(p.money)}</div>`).join('')}`;}
socket.on('state',s=>{state=s;render()});socket.on('disconnect',()=>{$('actionError').textContent='서버 연결이 끊겼습니다. 새로고침하면 새로 입장해야 합니다.'});
</script></body></html>
